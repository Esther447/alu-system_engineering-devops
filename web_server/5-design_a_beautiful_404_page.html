<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Lost in Space</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #1a1a2e;
            color: #ffffff;
            padding: 50px;
        }
        h1 {
            font-size: 100px;
            margin: 0;
            color: #ff6b6b;
        }
        p {
            font-size: 20px;
            margin-bottom: 30px;
        }
        .home-link {
            display: inline-block;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-radius: 5px;
        }
        .home-link:hover {
            background-color: #0056b3;
        }
        .animation {
            width: 300px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Oops! Ceci n'est pas une page.</p>
    <p>Looks like you’re lost in space.</p>
    <img class="animation" src="https://i.gifer.com/7jKw.gif" alt="Astronaut floating in space">
    <br>
    <a class="home-link" href="/">🚀 Go Home</a>
</body>
</html>
