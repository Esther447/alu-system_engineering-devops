<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 3em;
            color: #ff6347;
        }

        p {
            font-size: 1.2em;
            margin-top: 10px;
            color: #555;
        }

        .mascot {
            margin-top: 20px;
            width: 120px;
            animation: float 2s ease-in-out infinite;
        }

        .btn {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 1.2em;
            background-color: #ff6347;
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #e5533d;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div>
        <h1>404 - Lost in Space</h1>
        <p>Ceci n’est pas une page</p>
        <img src="https://www.clipartmax.com/png/full/66-669648_space-astronaut-clipart-astronaut-in-space.png" alt="Lost Astronaut" class="mascot">
        <br>
        <button class="btn" onclick="window.location.href='/'">Back to Home</button>
    </div>
</body>
</html>
